name: Daily job scrape

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate company registry
        run: python main.py --validate

      - name: Run scraper
        run: python main.py

      - name: Commit and push updated state
        run: |
          git config user.name "job-scraper-bot"
          git config user.email "actions@users.noreply.github.com"

          # data/digests/ (not a *.md glob) so this doesn't fail on days
          # with no new digest file -- an unmatched glob would abort the
          # step under GitHub Actions' default `bash -e`.
          git add data/jobs_seen.csv data/scraper_health.csv data/digests/

          if git diff --cached --quiet; then
            echo "Nothing changed, skipping commit."
            exit 0
          fi

          NEW_COUNT=$(cat data/NEW_JOBS_COUNT 2>/dev/null || echo "0")
          TODAY=$(date -u +%Y-%m-%d)

          # No `|| true` on the commit. The "nothing changed" case is already
          # handled by the diff check above, so a commit failure here is a
          # real one and must turn the run red. Swallowing it produces a
          # green run with no digest, which is the one failure mode this
          # project cannot detect from the outside.
          git commit -m "scrape: ${TODAY} (${NEW_COUNT} new jobs)"

          # The run takes 30+ minutes, so a manual push to main during that
          # window is a real race, not a hypothetical: it happened on the
          # first run. Retry by rebasing onto the new tip rather than giving
          # up on the first rejection. A genuine conflict (something else
          # touched the exact same state files) still aborts the script,
          # since this runs under Actions' default `bash -e` -- that failure
          # is real and must stay red.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}/3), rebasing onto latest origin/main"
            git fetch origin main
            git rebase origin/main
          done

          echo "git push failed after 3 attempts" >&2
          exit 1
